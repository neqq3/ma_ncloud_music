name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "ncloud_music/manifest.json"
      - "docs/releases/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release
        id: release
        shell: bash
        run: |
          set -e

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(python3 - <<'PY'
          import json
          with open('ncloud_music/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )"
          fi

          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          FILE="docs/releases/${TAG}.md"
          if [ -f "$FILE" ]; then
            TITLE="$(head -n 1 "$FILE" | sed -E 's/^#[[:space:]]*//')"
            [ -n "$TITLE" ] || TITLE="$TAG"
            echo "has_file=true" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "has_file=false" >> "$GITHUB_OUTPUT"
            echo "title=$TAG" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check Existing Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release From File
        if: steps.existing.outputs.exists != 'true' && steps.release.outputs.has_file == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: ${{ steps.release.outputs.file }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}

      - name: Create Release With Auto Notes
        if: steps.existing.outputs.exists != 'true' && steps.release.outputs.has_file != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}

      - name: Sync Release Tag To GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: ${{ secrets.GITCODE_REPO || github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -e

          if [ -z "$GITCODE_TOKEN" ] || [ -z "$GITCODE_REPO" ]; then
            echo "GitCode tag sync skipped: missing GITCODE_TOKEN or GITCODE_REPO."
            exit 0
          fi

          git fetch --tags origin
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist on GitHub."
            exit 1
          fi

          GITCODE_USER="$(echo "$GITCODE_REPO" | cut -d'/' -f1)"
          GITCODE_URL="https://${GITCODE_USER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_REPO}.git"

          git remote remove domestic 2>/dev/null || true
          git remote add domestic "$GITCODE_URL"
          git push domestic "refs/tags/$TAG:refs/tags/$TAG" --force

      - name: Sync Release To GitCode
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: ${{ secrets.GITCODE_REPO || github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          HAS_FILE: ${{ steps.release.outputs.has_file }}
          NOTES_FILE: ${{ steps.release.outputs.file }}
        shell: bash
        run: |
          set -e

          if [ -z "$GITCODE_TOKEN" ] || [ -z "$GITCODE_REPO" ]; then
            echo "GitCode release sync skipped: missing GITCODE_TOKEN or GITCODE_REPO."
            exit 0
          fi

          OWNER="${GITCODE_REPO%%/*}"
          REPO="${GITCODE_REPO#*/}"
          API_BASE="https://api.gitcode.com/api/v5/repos/${OWNER}/${REPO}/releases"

          HTTP_CODE="$(curl -sS -o /tmp/gitcode_release_lookup.json -w '%{http_code}' \
            "${API_BASE}/tags/${TAG}?access_token=${GITCODE_TOKEN}")"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "GitCode release $TAG already exists, skipped."
            exit 0
          fi

          if [ "$HAS_FILE" = "true" ] && [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/gitcode_release_body.md
          else
            gh release view "$TAG" --json body -q .body > /tmp/gitcode_release_body.md || true
            if [ ! -s /tmp/gitcode_release_body.md ]; then
              printf 'Release %s\n' "$TAG" > /tmp/gitcode_release_body.md
            fi
          fi

          if [ "$PRERELEASE" = "true" ]; then
            export RELEASE_STATUS="pre"
          else
            export RELEASE_STATUS="latest"
          fi

          python3 - <<'PY'
          import json
          import os

          with open('/tmp/gitcode_release_body.md', encoding='utf-8') as f:
              body = f.read()

          payload = {
              'tag_name': os.environ['TAG'],
              'name': os.environ['TITLE'],
              'body': body,
              'release_status': os.environ['RELEASE_STATUS'],
          }

          with open('/tmp/gitcode_release_payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          HTTP_CODE="$(curl -sS -o /tmp/gitcode_release_create.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/gitcode_release_payload.json \
            "${API_BASE}?access_token=${GITCODE_TOKEN}")"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Failed to create GitCode release $TAG (HTTP $HTTP_CODE)."
            cat /tmp/gitcode_release_create.json
            exit 1
          fi

          echo "GitCode release $TAG synced successfully."
